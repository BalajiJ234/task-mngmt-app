name: CI/CD Pipeline for Microservices & Microfrontends

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Install Docker & Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose

      - name: Debug - Show Directory Structure
        run: |
          pwd
          ls -R

      - name: Run Docker Compose Build
        run: |
          cd docker
          docker-compose build

      - name: Run Docker Compose Up (Optional for Testing)
        run: |
          cd docker
          docker-compose up -d
